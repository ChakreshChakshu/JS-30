<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 - Tip Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 1 &bull; DOM &amp; Events</span>
    <h1>Tip Calculator</h1>
    <p class="subtitle">Enter bill details to calculate tip and split amounts.</p>

    <div class="form-group">
      <label for="billAmount">Bill Amount ($)</label>
      <input type="number" id="billAmount" min="0" step="0.01" placeholder="0.00">
    </div>

    <div class="form-group">
      <label>Select Tip %</label>
      <div class="tip-presets">
        <button type="button" class="tip-btn" data-tip="5">5%</button>
        <button type="button" class="tip-btn active" data-tip="10">10%</button>
        <button type="button" class="tip-btn" data-tip="15">15%</button>
        <button type="button" class="tip-btn" data-tip="20">20%</button>
      </div>
      <input type="number" id="customTip" min="0" max="100" placeholder="Custom %">
    </div>

    <div class="form-group">
      <label for="peopleCount">Number of People</label>
      <input type="number" id="peopleCount" min="1" value="1">
    </div>

    <div class="results-box">
      <div class="result-row">
        <span>Tip Amount:</span>
        <strong id="tipAmount">$0.00</strong>
      </div>
      <div class="result-row">
        <span>Total Bill:</span>
        <strong id="totalAmount">$0.00</strong>
      </div>
      <div class="divider"></div>
      <div class="result-row highlight">
        <span>Tip / Person:</span>
        <strong id="tipPerPerson">$0.00</strong>
      </div>
      <div class="result-row highlight">
        <span>Total / Person:</span>
        <strong id="totalPerPerson">$0.00</strong>
      </div>
    </div>

    <button type="button" class="btn btn-reset" id="resetBtn">Reset</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
