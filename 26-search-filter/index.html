<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>26 - Search Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 3 &bull; Intermediate Browser JavaScript</span>
    <h1>Technology Search Filter</h1>
    <p class="subtitle">Type to search through modern developer technologies.</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, tag, or topic..." autofocus>
      <span class="result-count" id="resultCount">24 results</span>
    </div>

    <ul class="item-list" id="itemList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
