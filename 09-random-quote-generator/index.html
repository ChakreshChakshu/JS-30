<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 - Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 1 &bull; DOM &amp; Events</span>
    <h1>Random Quote Generator</h1>

    <div class="quote-card">
      <span class="quote-tag" id="quoteTag">Innovation</span>
      <blockquote id="quoteText">"The only way to do great work is to love what you do."</blockquote>
      <cite id="quoteAuthor">&mdash; Steve Jobs</cite>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" id="copyBtn">Copy Quote</button>
      <button type="button" class="btn btn-primary" id="newQuoteBtn">New Quote</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
