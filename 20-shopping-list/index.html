<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20 - Shopping List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 2 &bull; Core JavaScript</span>
    <h1>Shopping List</h1>
    <p class="subtitle">Keep track of groceries and purchases.</p>

    <form id="itemForm" class="add-form">
      <input type="text" id="itemInput" placeholder="Add an item (e.g., Organic Milk)..." required>
      <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
    </form>

    <div class="list-summary">
      <span id="summaryText">0 items (0 purchased)</span>
      <button type="button" class="clear-btn" id="clearAllBtn">Clear All</button>
    </div>

    <ul class="item-list" id="itemList">
      <li class="empty-state">Your shopping list is empty.</li>
    </ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
