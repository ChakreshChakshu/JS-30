<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24 - Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 3 &bull; Intermediate Browser JavaScript</span>
    <h1>Frontend Quiz</h1>

    <div id="quizScreen">
      <div class="progress-bar-wrapper">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="quiz-meta">
        <span id="questionCounter">Question 1 of 10</span>
        <span id="scoreCounter">Score: 0</span>
      </div>

      <h2 class="question-text" id="questionText">Question goes here?</h2>

      <div class="options-grid" id="optionsContainer"></div>

      <button type="button" class="btn btn-primary next-btn" id="nextBtn" disabled>Next Question &rarr;</button>
    </div>

    <div id="resultScreen" style="display: none;" class="result-screen">
      <h2>Quiz Completed!</h2>
      <div class="final-score" id="finalScore">0 / 10</div>
      <p class="final-feedback" id="finalFeedback">Great effort!</p>
      <button type="button" class="btn btn-primary" id="restartBtn">Restart Quiz</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
