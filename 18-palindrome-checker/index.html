<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18 - Palindrome Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 2 &bull; Core JavaScript</span>
    <h1>Palindrome Checker</h1>
    <p class="subtitle">Check if text reads the same forward and backward.</p>

    <div class="input-group">
      <input type="text" id="textInput" placeholder="e.g. racecar, Madam, in Eden, I'm Adam">
      <button type="button" class="btn btn-primary" id="checkBtn">Check</button>
    </div>

    <div class="samples">
      <span class="samples-label">Try:</span>
      <button type="button" class="chip">Racecar</button>
      <button type="button" class="chip">A man, a plan, a canal: Panama</button>
      <button type="button" class="chip">Hello World</button>
    </div>

    <div class="result-box" id="resultBox">
      <span class="status-heading" id="statusHeading">Enter text and click Check</span>
      <div class="details" id="details" style="display: none;">
        <p>Cleaned: <strong id="cleanedText"></strong></p>
        <p>Reversed: <strong id="reversedText"></strong></p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
