<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 - Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="badge">Level 1 &bull; DOM &amp; Events</span>
    <h1>Digital Clock</h1>

    <div class="clock-face">
      <div class="time-segments">
        <span class="time-digit" id="hours">00</span>
        <span class="separator">:</span>
        <span class="time-digit" id="minutes">00</span>
        <span class="separator">:</span>
        <span class="time-digit" id="seconds">00</span>
      </div>
      <span class="ampm-badge" id="ampmBadge">AM</span>
    </div>

    <div class="date-display" id="dateDisplay">Wednesday, October 7, 2026</div>

    <div class="controls">
      <button type="button" class="btn" id="formatToggle">Switch to 24-Hour</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
